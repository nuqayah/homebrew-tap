name: brew bump

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/autobump.yml
  schedule:
    - cron: "31 4 * * *"

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  autobump:
    runs-on: macos-15
    permissions:
      contents: write
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@3cdb78d0f62ad29dd32de765782654f4eedea607 # 2026.08.31.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump casks
        env:
          HOMEBREW_GITHUB_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          bumps=$(
            brew livecheck --quiet --casks --json --tap="$TAP_NAME" |
              jq -r '.[] | select(.version.outdated) | [.cask, .version.latest] | @tsv'
          )
          while IFS=$'\t' read -r cask version; do
            [[ -z "$cask" ]] || brew bump-cask-pr --write-only --version="$version" "$cask"
          done <<< "$bumps"

          git diff --quiet && exit 0
          git add Casks
          git commit -m "casks: update to latest versions"
          git push origin HEAD:main
